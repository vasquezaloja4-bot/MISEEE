name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            DIR=$(dirname "$PKG_FILE")
            echo "Found package.json in $DIR"
            cd "$DIR" && npm install
          else
            echo "No package.json found anywhere. Creating a default one..."
            npm init -y
            npm install
          fi

      - name: Run build / test
        run: |
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          DIR=$(dirname "$PKG_FILE")
          cd "$DIR" && npm test --if-present
