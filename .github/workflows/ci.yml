name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            DIR=$(dirname "$PKG_FILE")
            echo "Found package.json in $DIR"
            cd "$DIR" && npm install
          else
            echo "No package.json found anywhere. Creating a default one..."
            npm init -y
            npm install
          fi

      - name: Run build / test
        run: |
          PKG_FILE=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          DIR=$(dirname "$PKG_FILE")
          cd "$DIR"
          # Only run tests if a real custom test script is defined (avoids the default 'no test specified' error)
          if node -e 'const p = require("./package.json"); process.exit(p.scripts && p.scripts.test && !p.scripts.test.includes("no test specified") ? 0 : 1)'; then
            npm test
          else
            echo "No custom test script defined in package.json. Skipping tests."
          fi
          - name: Upload Build Artifacts
  uses: actions/upload-artifact@v4
  with:
    name: my-build-files
    path: build/ # Replace with your actual output folder path (e.g., dist/, build/, etc.)
