name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        # Uncomment and change 'my-subfolder' if package.json is in a subfolder:
        # working-directory: ./my-subfolder

      - name: Run build / test
        run: npm test
        # working-directory: ./my-subfolder
