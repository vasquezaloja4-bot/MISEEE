name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./your-folder-name  # Replace with your subfolder path (e.g., ./client), or remove this line if your files are in the root

      - name: Run build / test
        run: npm test
        working-directory: ./your-folder-name  # Match the same path here if using a subfolder
